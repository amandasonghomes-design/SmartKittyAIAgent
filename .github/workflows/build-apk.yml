# Builds the Android app (APK) on GitHub's computers and publishes it on the Releases page.
# Runs automatically when code changes on main, or by hand from the Actions tab ("Run workflow").
name: Build APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

# If two builds start close together, only the newest one finishes.
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu computers already include the Android SDK; just accept its licenses.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: version
        run: |
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tag=v$name.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Prepare signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Using the release signing key."
          else
            echo "No signing key secret set: using a temporary key."
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/SmartKitty-${{ steps.version.outputs.name }}.apk"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: 猫猫小助手 Smart Kitty ${{ steps.version.outputs.tag }}
          make_latest: true
          files: out/*.apk
          body: |
            ## 📱 Install on your Android phone

            > [!IMPORTANT]
            > **Android phones only** (Android 8 or newer). This app does not work on iPhone or iPad.

            1. On your phone, tap **SmartKitty-${{ steps.version.outputs.name }}.apk** below to download it.
            2. Open the downloaded file and tap **Install**.

            > [!WARNING]
            > **You will see warnings while installing. This is expected.**
            > This app is not from the Google Play Store, so Android protects you by asking first:
            > - **"For your security, your phone is not allowed to install unknown apps from this source"**:
            >   tap **Settings**, turn on **Allow from this source**, then go back and tap **Install**.
            > - **Google Play Protect** may say the app is **unrecognized** or "unsafe". Tap
            >   **More details → Install anyway**. It warns because the app is new and not on the Play Store.
            > - Only install APKs from this official page. Never install a copy someone sends you elsewhere.

            ## 🔑 What you need
            - Your own **OpenAI API key** (paste it in the app's Settings). New to this? **Start with just $5**:
              pay as you go, no subscription, about a tenth of a cent per chat message. A ChatGPT Plus
              subscription doesn't include it. 👉 [How to get your key in 5 minutes](https://github.com/${{ github.repository }}/blob/main/GET_OPENAI_KEY.md)
            - Chat, voice, photos, pictures, web search and memory work right away.
            - **Gmail cleanup** needs your own free Google Cloud setup: see [SETUP.md](https://github.com/${{ github.repository }}/blob/main/SETUP.md).

            ## ⬆️ Updating
            Install the new APK over the old one. If Android says the app "conflicts with an existing package",
            uninstall the old version first (your chats and settings on the phone will be erased).

      # Keep only the newest release: delete older releases and their tags.
      - name: Remove older releases
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ steps.version.outputs.tag }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' |
            while read -r tag; do
              if [ "$tag" != "$KEEP" ]; then
                echo "Deleting old release $tag"
                gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag
              fi
            done
